[project]
name = "fraud-detection-system"
version = "1.0.0"
description = "Production-grade real-time credit card fraud detection: PostgreSQL feature store, leakage-safe feature engineering, XGBoost/LightGBM, MLflow, FastAPI, Redis, drift monitoring."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scipy>=1.12",
    "scikit-learn>=1.4", "xgboost>=2.0", "lightgbm>=4.3",
    "optuna>=3.5", "shap>=0.45", "mlflow>=2.12", "joblib>=1.3",
    "fastapi>=0.110", "uvicorn[standard]>=0.29",
    "pydantic>=2.6", "pydantic-settings>=2.2", "PyYAML>=6.0",
    "redis>=5.0", "prometheus-client>=0.20", "httpx>=0.27",
    "sqlalchemy>=2.0", "psycopg[binary]>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "mlops*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
